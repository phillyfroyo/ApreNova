<!DOCTYPE html>
<html><head><title>Timing Debug</title></head>
<body>
<h2>Chapter Audio Timing Debug</h2>
<button onclick="run()">Fetch Timings</button>
<pre id="out" style="font-size:12px;white-space:pre-wrap;"></pre>
<script>
async function run() {
  var out = document.getElementById('out');
  out.textContent = 'Fetching...';
  try {
    var r = await fetch('/api/azure-tts/chapter', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({storySlug:'the-last-word',level:'C1',chapter:1,mode:'bilingual-en',speed:'normal'})
    });
    var text = await r.text();
    var lines = text.trim().split('\n');
    var d = JSON.parse(lines[lines.length - 1]);
    var m = d.metadata;
    var result = '';
    result += 'Total sentences: ' + m.sentenceTimings.length + '\n';
    result += 'Total duration: ' + m.totalDuration + 's\n';
    result += 'Pages: ' + m.pageBoundaries.map(function(p){return p.pageNumber}).join(', ') + '\n\n';

    for (var pg = 3; pg <= 4; pg++) {
      var sents = m.sentenceTimings.filter(function(s){return s.pageNumber === pg});
      var show = pg === 3 ? sents.slice(-4) : sents.slice(0, 2);
      result += '=== PAGE ' + pg + ' (' + sents.length + ' total sentences) ===\n';
      show.forEach(function(s, idx) {
        var wt = s.wordTimings || [];
        var firstW = wt.length > 0 ? wt[0].startTime.toFixed(3) : 'none';
        var lastW = wt.length > 0 ? wt[wt.length-1].endTime.toFixed(3) : 'none';
        result += '  [' + s.startTime.toFixed(3) + ' - ' + s.endTime.toFixed(3) + '] ';
        result += 'lang=' + s.language + ' words=' + wt.length + ' ';
        result += 'firstWordStart=' + firstW + ' lastWordEnd=' + lastW + '\n';
        result += '  "' + s.text.substring(0, 60) + '"\n';
      });
      result += '\n';
    }

    // Also show page boundaries
    result += '=== PAGE BOUNDARIES ===\n';
    m.pageBoundaries.forEach(function(p) {
      result += '  Page ' + p.pageNumber + ': ' + p.startTime.toFixed(3) + ' - ' + p.endTime.toFixed(3) + ' (' + p.sentenceCount + ' sentences)\n';
    });

    out.textContent = result;
  } catch(e) {
    out.textContent = 'Error: ' + e.message;
  }
}
</script>
</body>
</html>
